name: AOT comparison
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  AVALONIA_TELEMETRY_OPTOUT: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            runtime: win-x64
          - os: macos-15
            runtime: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: dotnet restore --locked-mode
      - run: python scripts/check_dependencies.py
      - run: python -m unittest discover -s tests/release -v
      - run: dotnet build -c Release --no-restore -p:UseSharedCompilation=false
      - run: dotnet run --project tests/BlueforsMonitor.Tests -c Release --no-build
      - name: Prepare native Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC x64 compiler is required' }
          $vcvars = Join-Path $installation 'VC\Auxiliary\Build\vcvars64.bat'
          $lines = & cmd.exe /d /c "`"$vcvars`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot initialize MSVC' }
          foreach ($line in $lines) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH|VCToolsInstallDir|VCINSTALLDIR|WindowsSdkDir|WindowsSDKVersion)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
      - name: Build JIT control package
        run: python scripts/release.py build --runtime ${{ matrix.runtime }} --deployment jit --output artifacts/comparison
      - name: Build Native AOT candidate (warnings are errors)
        run: python scripts/release.py build --runtime ${{ matrix.runtime }} --deployment aot --output artifacts/comparison
      - name: Exercise shipped binaries and compare startup
        run: python scripts/compare_packages.py --directory artifacts/comparison --runtime ${{ matrix.runtime }} --output artifacts/checks
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aot-comparison-${{ matrix.runtime }}
          path: |
            artifacts/comparison/*.zip
            artifacts/comparison/*.json
            artifacts/comparison/SHA256SUMS
            artifacts/checks/comparison.json
            artifacts/checks/run-*/*.png
            artifacts/checks/run-*/report.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: aot-failure-${{ matrix.runtime }}
          path: artifacts/checks/state/error.txt
          if-no-files-found: ignore
